# NetworkMeasureBox: settings from a USB stick.
# Save this file as nmb.conf at the top level of a USB stick (FAT32, exFAT or ext4) and plug the stick
# into the box. Only the keys written here change; everything else stays as it is. A secret left empty
# (or __KEEP_CURRENT__) keeps its current value. The box writes nmb-import-result.txt to the stick
# (names of the changed settings, never their values) and applies the same file only once.
# The file holds your passwords in plain text: delete it from the stick after the import.

[network]
# Wi-Fi access point password (router mode), 8-63 characters
wifi_psk =
# PPPoE, when the box's WAN port is on the ISP's ONT or modem
pppoe_enabled = false
pppoe_user =
pppoe_password =

[telegram]
enabled = false
token =
