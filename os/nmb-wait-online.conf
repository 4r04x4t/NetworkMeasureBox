# NetworkMeasureBox: what "the network is online" means on this box (installed by setup.sh as
# /etc/systemd/system/NetworkManager-wait-online.service.d/50-nmb.conf).
#
# The stock unit runs `nm-online -s`, which waits for NetworkManager's "startup complete". In router mode
# netd takes the WAN port and the radio away from NetworkManager at boot and dials PPPoE itself, so that
# moment came only minutes later: the unit failed after its timeout and WireGuard and OpenVPN, which wait
# for network-online.target, started about 100 s late (seen on 2026-11-10 on the DIGI ONT). Without -s,
# nm-online waits for one active connection with an address: the LAN bridge in router mode, the wired or
# Wi-Fi uplink in standalone mode. A box with no network at all still fails it, as it should.
[Service]
ExecStart=
ExecStart=/usr/bin/nm-online -q
