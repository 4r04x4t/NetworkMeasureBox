# NetworkMeasureBox — Production High-Performance Kernel Sysctl Tuning
# Supports 10G/Multi-Gigabit throughput, microsecond ping polling, and BBR pacing.
# Install to: /etc/sysctl.d/99-nmb-performance.conf

# ==============================================================================
# 1. Socket Core & Backlog Buffers (10G Multi-Gigabit Burst Absorption)
# ==============================================================================
net.core.rmem_max = 67108864
net.core.wmem_max = 67108864
net.core.rmem_default = 1048576
net.core.wmem_default = 1048576
net.core.optmem_max = 2097152
net.core.netdev_max_backlog = 250000
net.core.somaxconn = 65535

# Kernel Socket Busy-Polling (ultra low-latency packet polling in microseconds)
net.core.busy_poll = 50
net.core.busy_read = 50

# Receive Flow Steering (RFS) global flow table
net.core.rps_sock_flow_entries = 32768

# ==============================================================================
# 2. TCP Buffer Scaling & Modern Congestion Control (BBR + FQ Pacing)
# ==============================================================================
# Minimum, Initial/Default, Maximum buffer sizes
net.ipv4.tcp_rmem = 4096 1048576 67108864
net.ipv4.tcp_wmem = 4096 1048576 67108864

# Fair Queue packet scheduler (required for BBR congestion control pacing)
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr

# TCP notsent low-water mark (prevents bufferbloat in socket send queue, critical for BBR)
net.ipv4.tcp_notsent_lowat = 16384

# Keep TCP window open across test pauses; do not reset window after idle
net.ipv4.tcp_slow_start_after_idle = 0
net.ipv4.tcp_window_scaling = 1
net.ipv4.tcp_timestamps = 1
net.ipv4.tcp_sack = 1
net.ipv4.tcp_dsack = 1
net.ipv4.tcp_adv_win_scale = 1

# Connection reuse & fast teardown
net.ipv4.tcp_fin_timeout = 15
net.ipv4.tcp_tw_reuse = 1
net.ipv4.tcp_max_syn_backlog = 3240000

# Path MTU Discovery & TCP Fast Open
net.ipv4.tcp_mtu_probing = 1
net.ipv4.tcp_fastopen = 3

# ==============================================================================
# 3. ICMP Permissions & Raw Socket Access for Unprivileged Users
# ==============================================================================
# Allow any local user (including 'nmb') to open ICMP datagram sockets (SOCK_DGRAM)
net.ipv4.ping_group_range = 0 2147483647

# ==============================================================================
# 4. Routing, IP Forwarding & Bridge Fast-Path (Mode A and Mode B)
# ==============================================================================
net.ipv4.ip_forward = 1
net.ipv4.conf.all.forwarding = 1
net.ipv4.conf.default.forwarding = 1

# Disable bridge Netfilter overhead in Mode B transparent bridging (prevents conntrack bloat)
net.bridge.bridge-nf-call-iptables = 0
net.bridge.bridge-nf-call-ip6tables = 0
net.bridge.bridge-nf-call-arptables = 0

# Reverse path filtering (loose mode: allows asymmetric routing, PPPoE return paths, and bridge mode)
net.ipv4.conf.default.rp_filter = 2
net.ipv4.conf.all.rp_filter = 2

# ==============================================================================
# 5. Virtual Memory (VM), RAM Page Cache & Storage I/O Decoupling
# ==============================================================================
# Keep directory structures and file inodes cached in RAM (prefer RAM cache retention)
vm.vfs_cache_pressure = 50

# Prevent swapping to slow storage: preserve application memory and network buffers in RAM
vm.swappiness = 1

# Asynchronous dirty page caching in RAM: absorb writes into RAM page cache without blocking network threads
vm.dirty_background_ratio = 5
vm.dirty_ratio = 20
vm.dirty_expire_centisecs = 3000
vm.dirty_writeback_centisecs = 500

# Guaranteed contiguous atomic RAM pool for kernel network interrupts (sk_buff, softirq burst allocation)
vm.min_free_kbytes = 65536
